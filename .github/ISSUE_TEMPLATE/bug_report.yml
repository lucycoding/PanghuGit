name: Bug Report
description: 报告一个 Bug / Report a bug
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告问题！请填写以下信息。
        Thanks for reporting! Please fill in the following information.

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Bug Description
      description: 清晰描述遇到的问题 / A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to Reproduce
      description: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected Behavior
      description: 你期望发生什么 / What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual Behavior
      description: 实际发生了什么 / What actually happened
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: PanghuGit 版本 / Version
      description: 可在菜单 → About PanghuGit 查看 / Found in menu → About PanghuGit
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS 版本
      description: 系统版本 / System version
      placeholder: "macOS 15.0 Sequoia"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / Relevant Logs
      description: |
        终端运行以下命令获取日志：
        ```bash
        log show --predicate 'subsystem == "com.lucy.panghugit"' --last 5m
        ```
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / Screenshots
      description: 如适用，添加截图帮助说明问题 / Add screenshots if applicable

  - type: textarea
    id: additional
    attributes:
      label: 补充信息 / Additional Context
      description: 任何其他有助于诊断问题的信息 / Any other context
