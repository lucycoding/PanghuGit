name: Feature Request
description: 提出功能建议 / Suggest a new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你希望添加的功能。
        Thanks for your suggestion! Please describe the feature you'd like.

  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / Problem Statement
      description: |
        这个功能要解决什么问题？
        What problem does this feature solve?
        例：当我 ... 时，很不方便，因为 ...
        Ex: When I ..., it's inconvenient because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案 / Proposed Solution
      description: |
        你希望如何解决？描述期望的行为。
        How would you like it to work? Describe the desired behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered
      description: |
        你考虑过哪些替代方案？
        What alternatives have you considered?

  - type: dropdown
    id: category
    attributes:
      label: 功能类别 / Feature Category
      options:
        - Finder 右键菜单 / Finder Context Menu
        - Git 操作 / Git Operation
        - UI/UX 改进 / UI/UX Improvement
        - 性能优化 / Performance
        - CLI / 命令行
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息 / Additional Context
      description: |
        截图、参考其他工具的实现、相关链接等。
        Screenshots, references to other tools, related links, etc.
